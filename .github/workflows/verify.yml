name: Verify web app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci --ignore-scripts
        working-directory: ai-bridge
      - run: npm test
        working-directory: ai-bridge
      - run: node --test relay/worker.test.mjs
      - run: python -m pytest -q
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify portable schemas and generate starter knowledge pack
        run: |
          python scripts/export_portable_schemas.py
          git diff --exit-code -- app/resources/portable_schemas.json
          python scripts/create_empty_knowledge_pack.py
          python scripts/export_knowledge_pack.py --verify knowledge
