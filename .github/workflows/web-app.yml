name: Publish web app
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'scripts/build_pages.py'
      - 'requirements.txt'
      - '.github/workflows/web-app.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
        id: pages
      - run: python -m pip install fastjsonschema==2.21.2
      - name: Fetch complete knowledge pack
        run: |
          curl -fL -o knowledge-pack.zip "https://github.com/${{ github.repository }}/releases/download/knowledge-pack-2026-11-09/knowledge-pack.zip"
          unzip -q knowledge-pack.zip -d knowledge-pack
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build -- --base "$PAGES_BASE_PATH/"
        working-directory: frontend
        env:
          VITE_BROWSER_APP: '1'
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: python scripts/build_pages.py --knowledge-pack knowledge-pack
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
