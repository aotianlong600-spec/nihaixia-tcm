# Include in the nginx http context. The existing TLS forwarding chain hides
# visitor IPs, so these limits intentionally cover all visitors together.
map $request_method $tcm_relay_limit_key {
    default $server_name;
    OPTIONS "";
}
limit_req_zone $tcm_relay_limit_key zone=tcm_relay_requests_v2:1m rate=2r/s;
limit_conn_zone $tcm_relay_limit_key zone=tcm_relay_connections_v2:1m;
