# Include inside the existing HTTPS server block; keep its certificate and ports.
location = /relay {
    client_max_body_size 2m;
    client_body_timeout 15s;
    limit_req zone=tcm_relay_requests burst=40 nodelay;
    limit_req_status 429;
    limit_conn tcm_relay_connections 16;
    limit_conn_status 429;
    error_page 429 = @tcm_relay_busy;
    error_page 413 = @tcm_relay_large;
    proxy_pass http://127.0.0.1:18769;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_request_buffering off;
    client_body_in_file_only off;
    proxy_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 105s;
    proxy_send_timeout 15s;
    access_log off;
}

location = /health {
    limit_req zone=tcm_relay_requests burst=40 nodelay;
    limit_req_status 429;
    error_page 429 = @tcm_relay_busy;
    proxy_pass http://127.0.0.1:18769;
    proxy_http_version 1.1;
    proxy_set_header Host localhost;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
    access_log off;
}

location @tcm_relay_busy {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://aotianlong600-spec.github.io" always;
    add_header Cache-Control no-store always;
    add_header Retry-After 2 always;
    return 429 '{"error":"relay_busy"}';
}

location @tcm_relay_large {
    default_type application/json;
    add_header Access-Control-Allow-Origin "https://aotianlong600-spec.github.io" always;
    add_header Cache-Control no-store always;
    return 413 '{"error":"request_too_large"}';
}
